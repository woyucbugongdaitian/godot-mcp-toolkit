name: Feature request
description: Propose a focused Godot automation workflow.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed tool behavior
      description: Describe inputs, outputs, validation, and whether it is headless, editor, or runtime.
    validations:
      required: true
